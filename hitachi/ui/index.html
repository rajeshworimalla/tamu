<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple Radar</title>
<meta name="description" content="Operations intelligence for Wacky Wheels Co.: trace and contain supply chain disruptions.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B1A14'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%237EE2A8' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='none' stroke='%237EE2A8' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/ops.css">
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/vendor/topojson-client.min.js"></script>
<script src="/static/vendor/cytoscape.min.js"></script>
</head>
<body>
<aside class="side">
  <a class="side-brand" href="#/ops">
    <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="#7EE2A8" stroke-width="2.6"/><circle cx="20" cy="20" r="9.5" fill="none" stroke="#7EE2A8" stroke-width="2.6"/><circle cx="20" cy="20" r="3.6" fill="#7EE2A8"/></svg>
    <span>Ripple<b>Radar</b></span>
  </a>
  <nav class="side-nav" id="sideNav"></nav>
  <svg class="side-art" viewBox="0 0 260 260" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-10 250C60 200 90 120 270 90" /><path d="M-10 262C70 210 110 140 270 120" /><path d="M-10 274C80 222 130 166 270 152" /><path d="M-10 286C90 236 150 194 270 186" />
  </svg>
</aside>
<div class="main">
  <header class="topbar">
    <span class="company"><span class="tile"><i data-ic="car"></i></span>Wacky Wheels Co.</span>
    <span class="grow"></span>
    <div class="model-wrap">
      <button class="model" id="model" aria-haspopup="listbox" aria-expanded="false"></button>
      <div class="model-menu" id="modelMenu" role="listbox" hidden></div>
    </div>
    <button class="btn btn-primary" id="simOpen"><i data-ic="send"></i> New event</button>
    <span class="avatar-btn" title="Operations analyst"><i data-ic="user"></i></span>
  </header>
  <main id="view"></main>
</div>

<dialog id="sim">
  <form method="dialog">
    <div class="dlg-head"><h3>Analyze event</h3><p>Paste a message from a supplier, plant or dealer. Preview only: the plan is checked but not sent to the enterprise server.</p></div>
    <div class="dlg-body">
      <textarea id="simText" placeholder="The Texas plant loses power next Wednesday and Thursday."></textarea>
      <p class="hint" style="margin-top:12px">Examples</p>
      <div class="chips" id="simExamples" style="margin-top:6px"></div>
      <p class="hint" style="margin-top:12px">Validation scenarios</p>
      <div class="chips" id="simTricks" style="margin-top:6px"></div>
      <p class="hint" style="margin-top:12px" id="simModel"></p>
    </div>
    <div class="dlg-foot"><span class="msg-line" id="simMsg"></span><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn btn-primary" id="simRun">Analyze event</button></div>
  </form>
</dialog>
<div class="tour" id="tour" hidden></div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
